<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- ATAR Hero social share card — 1200×630, used for og:image and twitter:image -->

  <!-- Background: navy → deeper navy gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="280" cy="315" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="280" cy="315" r="240" fill="url(#glow)"/>

  <!-- Decorative small stars scattered -->
  <g fill="#FBBF24" opacity="0.35">
    <circle cx="1020" cy="110" r="3"/>
    <circle cx="1080" cy="170" r="2"/>
    <circle cx="960" cy="80" r="2"/>
    <circle cx="1120" cy="500" r="3"/>
    <circle cx="1000" cy="560" r="2"/>
    <circle cx="900" cy="520" r="2"/>
    <circle cx="150" cy="100" r="2"/>
    <circle cx="80" cy="540" r="3"/>
    <circle cx="200" cy="560" r="2"/>
  </g>

  <!-- Primary hero star (large) -->
  <g transform="translate(180, 195)">
    <path d="M120 0
             L144 66
             L214 66
             L158 106
             L180 174
             L120 132
             L60 174
             L82 106
             L26 66
             L96 66
             Z"
          fill="#FBBF24"
          stroke="#FCD34D"
          stroke-width="3"
          stroke-linejoin="round"/>
    <path d="M120 42
             L132 78
             L170 78
             L140 100
             L152 138
             L120 115
             L88 138
             L100 100
             L70 78
             L108 78
             Z"
          fill="#F59E0B"
          opacity="0.35"/>
  </g>

  <!-- Text block -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="470" y="245" font-size="110" font-weight="900" fill="#FFFFFF" letter-spacing="-3">ATAR</text>
    <text x="470" y="365" font-size="110" font-weight="900" fill="#FBBF24" letter-spacing="-3">HERO</text>
    <text x="470" y="440" font-size="30" font-weight="500" fill="#BFDBFE" letter-spacing="0">Ace your ATAR.</text>
    <text x="470" y="480" font-size="24" font-weight="400" fill="#93C5FD" letter-spacing="0">VCAA past exams · Worked solutions · Timed practice</text>
  </g>

  <!-- Footer: not affiliated disclaimer + domain -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="470" y="560" font-size="20" font-weight="500" fill="#FBBF24">atarhero.com.au</text>
    <text x="470" y="590" font-size="16" font-weight="400" fill="#93C5FD" opacity="0.65">Not affiliated with VCAA</text>
  </g>
</svg>
