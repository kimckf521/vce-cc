  <!-- Wordmark on one line -->
  <g transform="translate(196, 0)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="108" font-size="72" font-weight="800" letter-spacing="-2">
      <tspan fill="#172554">ATAR</tspan><tspan fill="#2563EB"> HERO</tspan>
    </text>
