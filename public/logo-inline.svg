<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" fill="none">
  <!-- ATAR Hero inline/horizontal wordmark variant: icon + ATAR HERO on a single line. -->

  <!-- Icon badge -->
  <rect x="0" y="0" width="160" height="160" rx="36" fill="#172554"/>
  <path d="M80 30
           L96 74
           L142 74
           L105 101
           L120 146
           L80 117
           L40 146
           L55 101
           L18 74
           L64 74
           Z"
        fill="#FBBF24"
