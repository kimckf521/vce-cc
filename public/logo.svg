<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <!-- ATAR Hero primary horizontal logo: icon + wordmark. Use on light backgrounds. -->

  <!-- Icon badge (left) -->
  <rect x="0" y="0" width="160" height="160" rx="36" fill="#172554"/>
  <path d="M80 30
           L96 74
           L142 74
           L105 101
           L120 146
           L80 117
           L40 146
           L55 101
           L18 74
           L64 74
           Z"
        fill="#FBBF24"
        stroke="#FCD34D"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Wordmark (right) -->
  <g transform="translate(192, 0)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="78" font-size="58" font-weight="800" fill="#172554" letter-spacing="-1.5">ATAR</text>
    <text x="0" y="138" font-size="58" font-weight="800" fill="#2563EB" letter-spacing="-1.5">HERO</text>
  </g>
</svg>
